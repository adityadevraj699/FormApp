<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main class="container my-5">

  <!-- Header with Add Question button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Manage Questions</h3>
    <a href="/admin/question" class="btn btn-primary">
      <i class="bi bi-plus-circle me-1"></i> Add Question
    </a>
  </div>

  <!-- Questions Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Question</th>
          <th>Answer Type</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="q, iterStat : ${questions}">
          <td th:text="${iterStat.index + 1}"></td>
        <td th:utext="${#strings.replace(q.questionText, '\n', '<br/>')}"></td>
          <td th:text="${q.answerType}"></td>
        <td th:utext="${#strings.replace(q.category.categoryName, '\n', '<br/>')}"></td>
          <td>
            <a th:href="@{/admin/question/edit/{id}(id=${q.id})}" 
               class="btn btn-sm btn-warning me-2">
              <i class="bi bi-pencil-square"></i> Edit
            </a>
            <a href="#" class="btn btn-sm btn-danger" 
               th:onclick="'confirmDelete(' + ${q.id} + ')'" >
              <i class="bi bi-trash"></i> Delete
            </a>
          </td>
        </tr>
        <tr th:if="${questions.size() == 0}">
          <td colspan="5" class="text-center text-muted">No questions available</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Hidden input for server message -->
  <input type="hidden" id="serverMessage" th:value="${msg}">

  <!-- Bootstrap Icons & SweetAlert -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    function confirmDelete(id) {
      Swal.fire({
        title: 'Are you sure?',
        text: "You won't be able to revert this!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Yes, delete it!'
      }).then((result) => {
        if (result.isConfirmed) {
          window.location.href = '/admin/question/delete/' + id;
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('error') || lowerMsg.includes('failed');
        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</main>
</body>
</html>
