<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main class="container mt-4">
    <h2>Registered Students</h2>
    
   <!-- Bulk Upload Form -->
<div class="card p-3 mb-4 shadow-sm">
    <div class="mb-2">
        <p class="text-muted small">
            <strong>Note:</strong> Please upload an Excel (.xlsx) file in the following format:<br>
            <code>S.No | Roll No | Name | Email</code><br>
            (The first row should contain column headings, and data should start from the selected row.)
        </p>
    </div>

    <form th:action="@{/admin/student/RegisterBulkStudent}" 
          method="post" 
          enctype="multipart/form-data" 
          class="row g-3 align-items-end">
        
        <div class="col-md-5">
            <label class="form-label">Upload Excel File (.xlsx)</label>
            <input type="file" name="file" class="form-control" accept=".xlsx" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Data Start Row</label>
            <input type="number" name="startRow" class="form-control" min="2" value="2" required>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Upload</button>
        </div>
    </form>
</div>

    


    <!-- Filter & Search Form -->
    <form th:action="@{/admin/student}" method="get" class="row g-3 mb-3">
        <div class="col-auto">
            <select name="status" class="form-select">
                <option value="ALL" th:selected="${selectedStatus == 'ALL'}">All</option>
                <option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">APPROVED</option>
                <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">PENDING</option>
                <option value="DISABLED" th:selected="${selectedStatus == 'DISABLED'}">DISABLED</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="rollNo" placeholder="Search Roll No"
                   class="form-control" th:value="${searchRollNo}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filter</button>
        </div>
    </form>

    <!-- Student Table -->
    <table border="1" class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Email</th>
                <th>Status</th>
                <th>Update</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.name}"></td>
                <td th:text="${student.rollNo}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.status}"></td>
                <td>
    <form th:action="@{'/admin/student/updateStatus/' + ${student.id}}" method="post" style="display:inline-block;">
        <select name="status" class="form-select form-select-sm">
            <option th:value="PENDING" th:selected="${student.status == 'PENDING'}">PENDING</option>
            <option th:value="APPROVED" th:selected="${student.status == 'APPROVED'}">APPROVED</option>
            <option th:value="DISABLED" th:selected="${student.status == 'DISABLED'}">DISABLED</option>
        </select>
        <button type="submit" class="btn btn-sm btn-primary mt-1">Update</button>
    </form>

    <!-- Details Button -->
    <a th:href="@{'/admin/student/details/' + ${student.id}}" 
       class="btn btn-sm btn-info mt-1">Details</a>
</td>

            </tr>
        </tbody>
    </table>
    
    <input type="hidden" id="serverMessage" th:value="${mgs}">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || 
                        lowerMsg.includes('disabled') || 
                        lowerMsg.includes('pending') || 
                        lowerMsg.includes('not found');
        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>
    
    
</main>

</body>
</html>
