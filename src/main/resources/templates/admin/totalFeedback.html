<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main class="container my-5">

  <h2 class="mb-4">All Feedbacks</h2>

  <!-- Filter by Status -->
  <div class="mb-3">
    <label for="statusFilter" class="form-label">Filter by Status:</label>
    <select id="statusFilter" class="form-select w-auto">
        <option value="All">All</option>
        <option value="Upcoming">Upcoming</option>
        <option value="Ongoing">Ongoing</option>
        <option value="Expired">Expired</option>
    </select>
  </div>

  <!-- Feedback Table -->
  <table class="table table-bordered table-striped" id="feedbackTable">
    <thead class="table-primary">
      <tr>
        <th>Program</th>
        <th>Feedback Phase</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
        <th>Details</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="fb : ${feedbacks}">
        <td th:text="${fb.program.trainingProgram}"></td>
        <td th:text="${fb.feedbackPhase.phaseName}"></td>
        <td th:text="${fb.startDate}" class="startDate"></td>
        <td th:text="${fb.endDate}" class="endDate"></td>
        <td class="statusCell"></td>
        <td>
          <a th:href="@{'/admin/feedback/details/' + ${fb.id}}" 
             class="btn btn-sm btn-outline-primary">
              Details
          </a>
        </td>
        <td>
          <a href="javascript:void(0)" 
   th:onclick="'confirmDelete(' + ${fb.id} + ')'"
   class="btn btn-sm btn-danger">
   Delete
</a>

        </td>
      </tr>
    </tbody>
  </table>
  
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Status Calculation -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const rows = document.querySelectorAll("#feedbackTable tbody tr");

    rows.forEach(row => {
        const startStr = row.querySelector(".startDate").textContent.trim();
        const endStr   = row.querySelector(".endDate").textContent.trim();

        const startParts = startStr.split('-');
        const endParts = endStr.split('-');

        const startDate = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 1, parseInt(startParts[2]), 0,0,0);
        const endDate   = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]), 23,59,59);

        const now = new Date();
        let status = "";
        let color = "";

        if (now < startDate) {
            status = "Upcoming";
            color = "blue";
        } else if (now > endDate) {
            status = "Expired";
            color = "red";
        } else {
            status = "Ongoing";
            color = "green";
        }

        const statusCell = row.querySelector(".statusCell");
        statusCell.textContent = status;
        statusCell.style.color = color;
        statusCell.style.fontWeight = "bold";
        row.setAttribute("data-status", status);
    });
});
</script>

<!-- Filter Logic -->
<script>
const filterSelect = document.getElementById("statusFilter");
filterSelect.addEventListener("change", function() {
    const selected = this.value;
    const rows = document.querySelectorAll("#feedbackTable tbody tr");

    rows.forEach(row => {
        const status = row.getAttribute("data-status");
        row.style.display = (selected === "All" || status === selected) ? "" : "none";
    });
});
</script>
<!-- Hidden input for server message -->
<input type="hidden" id="serverMessage" th:value="${serverMessageModule}">

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
          const lowerMsg = serverMessage.toLowerCase();
          const isError = lowerMsg.includes('invalid') || 
                          lowerMsg.includes('disabled') || 
                          lowerMsg.includes('pending') || 
                          lowerMsg.includes('not found') || 
                          lowerMsg.includes('Cannot') ||
                          lowerMsg.includes('error');

          Swal.fire({
              title: isError ? 'Error' : 'Success',
              text: serverMessage,
              icon: isError ? 'error' : 'success',
              confirmButtonColor: '#2575fc',
              background: '#f9f9f9',
              color: '#333',
              timer: 4000,
              timerProgressBar: true
          });
      }
  });

  // Delete confirm function
  function confirmDelete(id) {
      Swal.fire({
          title: 'Are you sure?',
          text: "This feedback will be deleted permanently!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33',
          cancelButtonColor: '#3085d6',
          confirmButtonText: 'Yes, delete it!'
      }).then((result) => {
          if (result.isConfirmed) {
              // Redirect for delete
              window.location.href = '/admin/totalFeedback/delete/' + id;
          }
      });
  }
</script>

</main>
</body>
</html>
