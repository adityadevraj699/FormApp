<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Adminbase::layout(~{::main})}">

<body>
<main class="container my-4">
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .feedback-card {
            margin-bottom: 1rem;
        }
        .feedback-header {
            cursor: pointer;
        }
    </style>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Student Feedback</h2>

    <div th:each="feedback : ${feedbacks}" class="card feedback-card">
        <!-- Card header: feedback info -->
        <div class="card-header feedback-header" 
             data-bs-toggle="collapse" 
             th:data-bs-target="'#collapse'+${feedback.id}" 
             aria-expanded="false" 
             th:aria-controls="'collapse'+${feedback.id}">
            <strong th:text="${feedback.program.trainingProgram}">Program Name</strong> - 
            Phase: <span th:text="${feedback.feedbackPhase.phaseName}">Phase Name</span> 
            | From: <span th:text="${feedback.startDate}">Start</span> 
            To: <span th:text="${feedback.endDate}">End</span>
        </div>

        <!-- Collapsible body: student feedback table -->
        <div th:id="'collapse'+${feedback.id}" class="collapse">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Branch</th>
                            <th>Year</th>
                            <th>Contact</th>
                            <th>View Feedback</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${feedbackStudentsMap[feedback.id]}">
                            <td th:text="${student.rollNo}">RollNo</td>
                            <td th:text="${student.name}">Name</td>
                            <td th:text="${student.branch}">Branch</td>
                            <td th:text="${student.year}">Year</td>
                            <td th:text="${student.contactNo}">Contact</td>
                            <td>
                                <a th:href="@{'/admin/studentFeedback/detail/' + ${student.id} + '/' + ${feedback.id}}" 
                                   class="btn btn-sm btn-primary">
                                    View
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(feedbackStudentsMap[feedback.id])}">
                            <td colspan="6" class="text-center">No feedback submitted yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Optional: make only one collapse open at a time
    document.addEventListener("DOMContentLoaded", function() {
        const feedbackCollapses = document.querySelectorAll('.collapse');
        feedbackCollapses.forEach(collapseEl => {
            collapseEl.addEventListener('show.bs.collapse', () => {
                feedbackCollapses.forEach(other => {
                    if(other !== collapseEl) {
                        bootstrap.Collapse.getInstance(other)?.hide();
                    }
                });
            });
        });
    });
</script>

</main>
</body>
</html>
