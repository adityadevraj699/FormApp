<!DOCTYPE html>
<html th:replace="~{Adminbase::layout(~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="container py-5 animate__animated animate__fadeIn">
    
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-emerald rounded-4 overflow-hidden">
                
                <div class="card-header border-0 py-4 text-center bg-emerald-gradient">
                    <div class="audit-badge mb-2">AI QUALITY CHECK ACTIVE</div>
                    <h4 class="text-white mb-0 fw-900 text-uppercase ls-1">Modify Assignment</h4>
                    <p class="text-white-50 small mb-0 fw-bold">Pedagogical Excellence Re-Audit</p>
                </div>

                <div class="card-body p-4 p-md-5 bg-white">
                    <form th:action="@{'/admin/assignTeacher/edit/' + ${assign.id}}" method="post" id="editAssignmentForm">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-emerald-dark small text-uppercase ls-1">1. Update Faculty Node</label>
                            <div class="input-group shadow-sm rounded-3 overflow-hidden border-emerald-light">
                                <span class="input-group-text bg-emerald-soft border-0 text-emerald"><i class="bi bi-person-check-fill"></i></span>
                                <select class="form-select border-0 py-3 ps-2 shadow-none bg-white" id="teacherSelect" name="teacherId" required onchange="triggerAIAudit(this)">
                                    <option th:each="t : ${teachers}" 
                                            th:value="${t.id}" 
                                            th:text="${t.name}" 
                                            th:selected="${t.id == assign.teacher.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold text-emerald-dark small text-uppercase ls-1">2. Target Training Program</label>
                            <div class="input-group shadow-sm rounded-3 overflow-hidden border-emerald-light">
                                <span class="input-group-text bg-emerald-soft border-0 text-emerald"><i class="bi bi-journal-medical"></i></span>
                                <select class="form-select border-0 py-3 ps-2 shadow-none bg-white" id="programSelect" name="programId" required>
                                    <option th:each="p : ${programs}" 
                                            th:value="${p.id}" 
                                            th:text="${p.trainingProgram}"
                                            th:selected="${p.id == assign.program.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-emerald btn-lg flex-grow-1 rounded-pill fw-900 py-3 shadow-sm hover-up">
                                <i class="bi bi-shield-fill-check me-2"></i> COMMIT CHANGES
                            </button>
                            <a th:href="@{/admin/assignTeacher-manage}" class="btn btn-light-emerald btn-lg rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;" title="Cancel">
                                <i class="bi bi-arrow-left text-emerald"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-muted small fw-medium"><i class="bi bi-leaf-fill text-success me-1"></i> Data verified for SDG-4 Pedagogical Standards</p>
            </div>
        </div>
    </div>

    <input type="hidden" id="serverMessage" th:value="${serverMessage}">

    <style>
        :root {
            --emerald-main: #10b981;
            --emerald-dark: #064e3b;
            --emerald-light: #d1fae5;
            --emerald-soft: #ecfdf5;
        }

        .fw-900 { font-weight: 900; }
        .ls-1 { letter-spacing: 1px; }
        
        /* Emerald UI Toolkit */
        .bg-emerald-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .bg-emerald-soft { background-color: var(--emerald-soft); }
        .text-emerald { color: var(--emerald-main); }
        .text-emerald-dark { color: var(--emerald-dark); }
        .border-emerald-light { border: 1px solid var(--emerald-light); }
        
        .shadow-emerald { box-shadow: 0 20px 40px rgba(16, 185, 129, 0.15); }
        
        .audit-badge { background: rgba(255,255,255,0.2); color: white; font-size: 0.65rem; font-weight: 800; padding: 4px 12px; border-radius: 50px; display: inline-block; letter-spacing: 1px; }

        .btn-emerald { background-color: var(--emerald-main); color: white; border: none; }
        .btn-emerald:hover { background-color: #059669; color: white; }
        .btn-light-emerald { background-color: var(--emerald-soft); border: 1px solid var(--emerald-light); }

        .hover-up { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-up:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2) !important; }

        /* SweetAlert Emerald Overrides */
        .swal2-popup { border-radius: 30px !important; padding: 2rem !important; }
        .audit-tile-emerald { background: #f0fdf4; border-radius: 15px; padding: 15px; border: 1px solid #bbf7d0; }
        .ai-box-emerald { background: #064e3b; color: #ecfdf5; border-radius: 20px; padding: 20px; border-left: 6px solid #10b981; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        const analyticsData = /*[[${teacherAnalytics}]]*/ {};
        const initialTeacherId = /*[[${assign.teacher.id}]]*/ null;

        function triggerAIAudit(selectElement) {
            const teacherId = selectElement.value;
            if (teacherId == initialTeacherId) return;

            const stats = analyticsData[teacherId];
            if (!stats) return;

            let htmlContent = "";
            let icon = "info";

            if (stats.status === "NO_ASSIGNMENT") {
                htmlContent = `<div class="text-start"><span class="badge bg-success mb-2">New Node Profile</span><p class="small text-muted">${stats.summary}</p></div>`;
            } else if (stats.status === "PENDING_FEEDBACK") {
                htmlContent = `<div class="text-start"><span class="badge bg-warning text-dark mb-2">Audit Ongoing</span><p class="small text-muted">${stats.summary}</p></div>`;
            } else {
                icon = stats.power >= 70 ? "success" : "warning";
                htmlContent = `
                    <div class="text-start mt-2">
                        <div class="row text-center g-2 mb-3">
                            <div class="col-4"><div class="audit-tile-emerald"><small class="d-block text-muted">KPI</small><b class="text-success">${stats.avgRating}</b></div></div>
                            <div class="col-4"><div class="audit-tile-emerald"><small class="d-block text-muted">Sent.</small><b class="text-success">${stats.sentiment}</b></div></div>
                            <div class="col-4"><div class="audit-tile-emerald"><small class="d-block text-muted">Power</small><b class="text-emerald-dark">${stats.power}</b></div></div>
                        </div>
                        <div class="ai-box-emerald shadow-lg">
                            <small class="text-emerald fw-bold d-block mb-1"><i class="bi bi-robot me-1"></i> SDG-4 SMART RE-AUDIT</small>
                            <p class="small mb-0 italic" style="line-height:1.5">"${stats.summary}"</p>
                        </div>
                    </div>`;
            }

            Swal.fire({
                title: '<span style="color:#064e3b">Faculty Re-Audit</span>',
                html: htmlContent,
                icon: icon,
                showCancelButton: true,
                confirmButtonText: 'Authorize Change',
                cancelButtonText: 'Revert to Original',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#6b7280',
                reverseButtons: true,
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Audit Verified', showConfirmButton: false, timer: 2000 });
                } else {
                    selectElement.value = initialTeacherId;
                    Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: 'Original Faculty Retained', showConfirmButton: false, timer: 2000 });
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            const serverMessage = document.getElementById("serverMessage")?.value;
            if (serverMessage && serverMessage.trim() !== "") {
                const isError = /error|fail|invalid/i.test(serverMessage);
                Swal.fire({
                    title: isError ? 'Audit Error' : 'Success',
                    text: serverMessage,
                    icon: isError ? 'error' : 'success',
                    confirmButtonColor: '#10b981'
                });
            }
        });
    </script>
</main>
</body>
</html>
