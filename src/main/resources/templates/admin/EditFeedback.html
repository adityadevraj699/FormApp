<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
      <h4 class="fw-bold m-0">Edit Feedback</h4>
      <!-- Back button -->
      <a th:href="@{/admin/totalFeedback}" class="btn btn-sm btn-outline-dark fw-bold">
        ⬅ Back
      </a>
    </div>
    <div class="card-body">
<form th:action="@{/admin/feedback/edit/{id}(id=${feedback.id})}" method="post">

  <!-- Program Select -->
  <div class="mb-3">
    <label for="programSelect" class="form-label fw-bold">Select Program</label>
    <select class="form-select" id="programSelect" name="program.id" required>
      <option value="">-- Select Program --</option>
      <option th:each="p : ${programs}" 
              th:value="${p.id}" 
              th:text="${p.trainingProgram}" 
              th:selected="${p.id == feedback.program.id}">
      </option>
    </select>
  </div>

  <!-- Phase Select -->
  <div class="mb-3">
    <label for="phaseSelect" class="form-label fw-bold">Select Feedback Phase</label>
    <select class="form-select" id="phaseSelect" name="feedbackPhase.id" required>
      <option value="">-- Select Phase --</option>
      <option th:each="ph : ${phases}" 
              th:value="${ph.id}" 
              th:text="${ph.phaseName}" 
              th:selected="${ph.id == feedback.feedbackPhase.id}"></option>
    </select>
  </div>

  <!-- Categories Checkboxes -->
  <div class="mb-3">
    <label class="form-label fw-bold">Select Question Categories</label>
    <div th:each="cat : ${categories}" class="form-check">
      <input class="form-check-input" type="checkbox"
             th:id="${'cat_' + cat.id}" 
             th:name="categoryIds" 
             th:value="${cat.id}"
             th:checked="${selectedCatIds.contains(cat.id)}">
      <label class="form-check-label" th:for="${'cat_' + cat.id}" 
             th:text="${cat.categoryName}"></label>
    </div>
  </div>

  <!-- Start Date -->
  <div class="mb-3">
    <label class="form-label fw-bold">Start Date</label>
    <input type="date" class="form-control" name="startDate" 
           th:value="${feedback.startDate}" required>
  </div>

  <!-- End Date -->
  <div class="mb-3">
    <label class="form-label fw-bold">End Date</label>
    <input type="date" class="form-control" name="endDate" 
           th:value="${feedback.endDate}" required>
  </div>

  <!-- Submit -->
  <div class="d-grid">
    <button type="submit" class="btn btn-success btn-lg fw-bold">
      Update Feedback
    </button>
  </div>
</form>
    </div>
  </div>
</main>
</body>
</html>
