<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-sm">
          
          <!-- Card Header -->
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="fw-bold m-0">Training Program</h4>
            <a href="/admin/manage-program" class="btn btn-light btn-sm fw-bold">
              <i class="bi bi-gear me-1"></i> Manage Program
            </a>
          </div>

          <!-- Card Body -->
          <div class="card-body">
            <form method="post" th:action="@{/admin/program}">
              
              <div class="row g-3">
                <!-- Course -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Course</label>
                  <select class="form-select" name="course" >
                    <option value="" selected disabled>Select Course</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="B.Pharm">B.Pharm</option>
                    <option value="BCA">BCA</option>
                    <option value="B.Com">B.Com</option>
                    <option value="BBA">BBA</option>
                    <option value="M.Tech">M.Tech</option>
                    <option value="M.Pharm">M.Pharm</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Sc">B.Sc</option>
                  </select>
                </div>

                <!-- Branch -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Branch</label>
                  <select class="form-select" name="branch">
                    <option value="" selected disabled>Select Branch</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="IT">IT</option>
                    <option value="MECH">Mechanical</option>
                    <option value="CIVIL">Civil</option>
                    <option value="EEE">EEE</option>
                    <option value="CHE">Chemical</option>
                    <option value="BIO">Biotechnology</option>
                    <option value="AERO">Aeronautical</option>
                    <option value="OTHER">Other</option>
                  </select>
                </div>

                <!-- Year -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Year</label>
                  <select class="form-select" name="year" >
                    <option value="" selected disabled>Select Year</option>
                    <option value="FIRST">FIRST</option>
                    <option value="SECOND">SECOND</option>
                    <option value="THIRD">THIRD</option>
                    <option value="FOURTH">FOURTH</option>
                  </select>
                </div>

                <!-- Semester -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Semester</label>
                  <select class="form-select" name="semester" >
                    <option value="" selected disabled>Select Semester</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                  </select>
                </div>

                <!-- Section -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Section</label>
                  <select class="form-select" name="section">
                    <option value="" selected disabled>Select Section</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                  </select>
                </div>

                <!-- Program Name -->
                <div class="col-md-6">
                  <label for="trainingProgram" class="form-label fw-bold">Program Name</label>
                  <input type="text" class="form-control" id="trainingProgram" name="trainingProgram" placeholder="Enter Training Program..." required>
                </div>

                <!-- Start Date -->
                <div class="col-md-6">
                  <label for="startDate" class="form-label fw-bold">Start Date</label>
                  <input type="date" class="form-control" id="startDate" name="startDate" required>
                </div>

                <!-- End Date -->
                <div class="col-md-6">
                  <label for="endDate" class="form-label fw-bold">End Date</label>
                  <input type="date" class="form-control" id="endDate" name="endDate" required>
                </div>

              </div>

              <!-- Submit Button -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg fw-bold">
                  <i class="bi bi-save2 me-2"></i> Create Program
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <input type="hidden" id="serverMessage" th:value="${serverMessage}">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || 
                        lowerMsg.includes('disabled') || 
                        lowerMsg.includes('pending') || 
                        lowerMsg.includes('not found');
        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</main>
</body>
</html>
