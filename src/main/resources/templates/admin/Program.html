<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <!-- Card Header -->
         <!-- Card Header -->
<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
  <h4 class="fw-bold m-0">Training Program</h4>
  <a href="/admin/manage-program" class="btn btn-light btn-sm fw-bold">
    <i class="bi bi-gear me-1"></i> Manage Program
  </a>
</div>

          <!-- Card Body -->
          <div class="card-body">
            <form method="post" th:action="@{/admin/program}">

              <!-- Program Name -->
              <div class="mb-4">
                <label for="trainingProgram" class="form-label fw-bold">Program Name</label>
                <input type="text" 
                       class="form-control" 
                       id="trainingProgram" 
                       name="trainingProgram" 
                       placeholder="Enter Training Program..." 
                       required>
              </div>

              <!-- Start Date -->
              <div class="mb-4">
                <label for="startDate" class="form-label fw-bold">Start Date</label>
                <input type="date" 
                       class="form-control" 
                       id="startDate" 
                       name="startDate" 
                       required>
              </div>

              <!-- End Date -->
              <div class="mb-4">
                <label for="endDate" class="form-label fw-bold">End Date</label>
                <input type="date" 
                       class="form-control" 
                       id="endDate" 
                       name="endDate" 
                       required>
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg fw-bold">
                  <i class="bi bi-save2 me-2"></i> Create Program
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <input type="hidden" id="serverMessage" th:value="${serverMessage}">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || 
                        lowerMsg.includes('disabled') || 
                        lowerMsg.includes('pending') || 
                        lowerMsg.includes('not found');
        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</main>
</body>
</html>
