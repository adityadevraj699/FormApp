<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="card shadow-sm">
      
      <!-- Card Header -->
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="fw-bold m-0">Assign Teacher to Program</h4>
        <a th:href="@{/admin/teacherManage}" class="btn btn-light btn-sm fw-bold">
          <i class="bi bi-plus-circle me-1"></i> Add Assignment
        </a>
      </div>

      <!-- Card Body -->
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Teacher Name</th>
                <th>Program Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Iterate over teacher assignments -->
              <tr th:each="t : ${teacherAssignments}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.teacher.name}"></td>
                <td th:text="${t.program.trainingProgram}"></td>
                <td>
                  <a th:href="@{'/admin/assignTeacher/edit/' + ${t.id}}" 
                     class="btn btn-sm btn-warning me-2">
                     <i class="bi bi-pencil-square"></i> Edit
                  </a>
                  <a th:href="@{'/admin/assignTeacher/delete/' + ${t.id}}" 
                     class="btn btn-sm btn-danger"
                     onclick="return confirm('Are you sure you want to delete this assignment?');">
                     <i class="bi bi-trash"></i> Delete
                  </a>
                </td>
              </tr>
            </tbody>
          </table>

          <!-- Hidden input for server message -->
          <input type="hidden" id="serverMessage" th:value="${serverMessage}" />

          <!-- SweetAlert2 -->
          <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              const serverMessage = document.getElementById("serverMessage")?.value;

              if (serverMessage && serverMessage.trim() !== "") {
                let icon = 'info';
                if (serverMessage.includes('❌')) icon = 'error';
                if (serverMessage.includes('✅')) icon = 'success';

                Swal.fire({
                  title: 'Notification',
                  text: serverMessage.replace('❌','').replace('✅','').trim(),
                  icon: icon,
                  confirmButtonColor: '#2575fc',
                  background: '#f9f9f9',
                  color: '#333',
                  timer: 4000,
                  timerProgressBar: true
                });
              }
            });
          </script>

        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
