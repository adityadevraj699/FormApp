<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">

    <h2>Module Management</h2>

    <table class="table table-bordered table-striped mt-4">
      <thead class="table-dark">
        <tr>
          <th>Module Name</th>
          <th>Program Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="module : ${modules}">
          <td th:text="${module.moduleName}">Module Name</td>
          <td th:text="${module.program.trainingProgram}">Program Name</td>
          <td>
            <a th:href="@{'/admin/module/edit/' + ${module.id}}" class="btn btn-primary btn-sm">Edit</a>
            <a th:href="@{'/admin/module/delete/' + ${module.id}}" class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this module?');">Delete</a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Hidden input for SweetAlert -->
    <input type="hidden" id="serverMessage" th:value="${serverMessageModule}">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const serverMessage = document.getElementById("serverMessage")?.value;
        if (serverMessage && serverMessage.trim() !== "") {
          const lowerMsg = serverMessage.toLowerCase();
          const isError = lowerMsg.includes('invalid') || lowerMsg.includes('not found');
          Swal.fire({
            title: 'Notification',
            text: serverMessage.replace('✅','').replace('❌','').trim(),
            icon: isError ? 'error' : 'success',
            confirmButtonColor: '#2575fc',
            timer: 4000,
            timerProgressBar: true
          });
        }
      });
    </script>

  </div>
</main>
</body>
</html>
