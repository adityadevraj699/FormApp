<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark text-center">
        <h4 class="fw-bold m-0">Edit Program</h4>
      </div>
      <div class="card-body">
        <form method="post" th:action="@{/admin/program/update}" th:object="${program}">
          <input type="hidden" th:field="*{id}">

          <!-- Program Name -->
          <div class="mb-4">
            <label class="form-label fw-bold">Program Name</label>
            <input type="text" class="form-control" th:field="*{trainingProgram}" required>
          </div>

          <!-- Start Date -->
          <div class="mb-4">
            <label class="form-label fw-bold">Start Date</label>
            <input type="date" class="form-control" 
                   th:field="*{startDate}" 
                   th:value="${#temporals.format(program.startDate, 'yyyy-MM-dd')}" required>
          </div>

          <!-- End Date -->
          <div class="mb-4">
            <label class="form-label fw-bold">End Date</label>
            <input type="date" class="form-control" 
                   th:field="*{endDate}" 
                   th:value="${#temporals.format(program.endDate, 'yyyy-MM-dd')}" required>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success fw-bold">
              <i class="bi bi-check2-circle me-1"></i> Update Program
            </button>
            <a href="http://localhost:8800/admin/manage-program" class="btn btn-secondary fw-bold">
              <i class="bi bi-x-circle me-1"></i> Cancel
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
