<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark text-center">
        <h4 class="fw-bold m-0">Edit Program</h4>
      </div>
      <div class="card-body">
        <form method="post" th:action="@{/admin/program/update}" th:object="${program}">
          <input type="hidden" th:field="*{id}">

          <div class="row g-3">

            <!-- Program Name -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Program Name <span style="color:red;">*</span></label>
              <input type="text" class="form-control" th:field="*{trainingProgram}" placeholder="Enter program name" required>
            </div>

            <!-- Start Date -->
            <div class="col-md-3">
              <label class="form-label fw-bold">Start Date <span style="color:red;">*</span></label>
              <input type="date" class="form-control" 
                     th:field="*{startDate}" 
                     th:value="${#temporals.format(program.startDate, 'yyyy-MM-dd')}" required>
            </div>

            <!-- End Date -->
            <div class="col-md-3">
              <label class="form-label fw-bold">End Date <span style="color:red;">*</span></label>
              <input type="date" class="form-control" 
                     th:field="*{endDate}" 
                     th:value="${#temporals.format(program.endDate, 'yyyy-MM-dd')}" required>
            </div>

            <!-- Course -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Course</label>
              <input type="text" class="form-control" th:field="*{course}" placeholder="Optional">
            </div>

            <!-- Branch -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Branch</label>
              <input type="text" class="form-control" th:field="*{branch}" placeholder="Optional">
            </div>

            <!-- Year -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Year</label>
              <input type="text" class="form-control" th:field="*{year}" placeholder="Optional">
            </div>

            <!-- Section -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Section</label>
              <input type="text" class="form-control" th:field="*{section}" placeholder="Optional">
            </div>

            <!-- Semester -->
            <div class="col-md-6">
              <label class="form-label fw-bold">Semester</label>
              <input type="text" class="form-control" th:field="*{semester}" placeholder="Optional">
            </div>

          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-success fw-bold">
              <i class="bi bi-check2-circle me-1"></i> Update Program
            </button>
            <a href="http://localhost:8800/admin/manage-program" class="btn btn-secondary fw-bold">
              <i class="bi bi-x-circle me-1"></i> Cancel
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
