<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <!-- Card Header -->
          <!-- Card Header -->
<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h4 class="fw-bold m-0">Module Management</h4>
    <a href="#" th:href="@{/admin/module-management}" class="btn btn-light btn-sm fw-bold">
        <i class="bi bi-list-check me-1"></i> Manage Modules
    </a>
</div>

          <!-- Card Body -->
          <div class="card-body">
            <form th:action="@{/admin/module}" method="post">

  <!-- Program Select -->
  <div class="mb-4">
    <label for="trainingProgram" class="form-label fw-bold">Select Program</label>
    <select class="form-select" id="trainingProgram" name="trainingProgram" required>
      <option value="">-- Select Program --</option>
      <option th:each="p : ${programs}" 
              th:value="${p.id}" 
              th:text="${p.trainingProgram}">
      </option>
    </select>
  </div>

  <!-- Module Inputs -->
  <div class="mb-4">
    <label class="form-label fw-bold">Module Names</label>
    <div id="moduleContainer">
      <div class="input-group mb-2 module-item">
        <input type="text" name="moduleNames" class="form-control" placeholder="Enter Module Name..." required>
        <button type="button" class="btn btn-danger removeModuleBtn">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <button type="button" id="addModuleBtn" class="btn btn-outline-primary btn-sm mt-2">
      <i class="bi bi-plus-circle"></i> Add Module
    </button>
  </div>

  <!-- Submit Button -->
  <div class="d-grid">
    <button type="submit" class="btn btn-success btn-lg fw-bold">
      <i class="bi bi-save2 me-2"></i> Save Modules
    </button>
  </div>

</form>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("moduleContainer");
    const addBtn = document.getElementById("addModuleBtn");

    addBtn.addEventListener("click", () => {
      const newInput = document.createElement("div");
      newInput.classList.add("input-group", "mb-2", "module-item");
      newInput.innerHTML = `
        <input type="text" name="moduleNames" class="form-control" placeholder="Enter Module Name..." required>
        <button type="button" class="btn btn-danger removeModuleBtn">
          <i class="bi bi-trash"></i>
        </button>
      `;
      container.appendChild(newInput);
    });

    container.addEventListener("click", (e) => {
      if (e.target.closest(".removeModuleBtn")) {
        e.target.closest(".module-item").remove();
      }
    });
  });
</script>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden input for server message -->
  <input type="hidden" id="serverMessage" th:value="${serverMessageModule}">


  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || 
                        lowerMsg.includes('disabled') || 
                        lowerMsg.includes('pending') || 
                        lowerMsg.includes('not found');

        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</main>
</body>
</html>
