<html th:replace="~{Adminbase::layout(~{::main})}">
<body>
<main>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">

         <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h4 class="fw-bold m-0">Curriculum Topic Management</h4>
    <!-- Button to go to Curriculum Management Table -->
    <a th:href="@{/admin/curriculum-management}" 
       class="btn btn-light btn-sm fw-bold">
       Curriculum Management
    </a>
</div>


          <!-- Card Body -->
          <div class="card-body">
           <form th:action="@{/admin/curriculumTopic}" method="post">

  <!-- Module Select -->
  <div class="mb-4">
    <label for="moduleSelect" class="form-label fw-bold">Select Module</label>
    <select class="form-select" id="moduleSelect" name="moduleId" required>
      <option value="">-- Select Module --</option>
      <option th:each="m : ${modules}" 
              th:value="${m.id}" 
              th:text="${m.moduleName}">
      </option>
    </select>
  </div>

  <!-- Curriculum Topics -->
  <div class="mb-4">
    <label class="form-label fw-bold">Curriculum Topics</label>
    <div id="topicContainer">
      <div class="input-group mb-2 topic-item">
        <input type="text" name="topicNames" class="form-control" placeholder="Enter Curriculum Topic..." required>
        <button type="button" class="btn btn-danger removeTopicBtn">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <button type="button" id="addTopicBtn" class="btn btn-outline-primary btn-sm mt-2">
      <i class="bi bi-plus-circle"></i> Add Topic
    </button>
  </div>

  <!-- Submit Button -->
  <div class="d-grid">
    <button type="submit" class="btn btn-success btn-lg fw-bold">
      <i class="bi bi-save2 me-2"></i> Save Curriculum Topics
    </button>
  </div>

</form>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("topicContainer");
    const addBtn = document.getElementById("addTopicBtn");

    // Add new topic input
    addBtn.addEventListener("click", () => {
      const newInput = document.createElement("div");
      newInput.classList.add("input-group", "mb-2", "topic-item");
      newInput.innerHTML = `
        <input type="text" name="topicNames" class="form-control" placeholder="Enter Curriculum Topic..." required>
        <button type="button" class="btn btn-danger removeTopicBtn">
          <i class="bi bi-trash"></i>
        </button>
      `;
      container.appendChild(newInput);
    });

    // Remove topic input
    container.addEventListener("click", (e) => {
      if (e.target.closest(".removeTopicBtn")) {
        e.target.closest(".topic-item").remove();
      }
    });
  });
</script>

<style>
  .removeTopicBtn i { pointer-events: none; }
  .topic-item input { flex: 1; }
</style>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden input for server message -->
  <input type="hidden" id="serverMessage" th:value="${serverMessage}">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || 
                        lowerMsg.includes('disabled') || 
                        lowerMsg.includes('pending') || 
                        lowerMsg.includes('not found');

        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#2575fc',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</main>
</body>
</html>
