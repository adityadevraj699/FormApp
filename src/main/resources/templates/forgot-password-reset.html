<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .reset-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 30px 25px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .reset-card h2 {
      color: #000;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .reset-card p {
      color: #000;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .form-control {
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      border-color: #1cc88a;
      box-shadow: 0 0 5px rgba(28,200,138,0.5);
      outline: none;
    }
    .btn-primary, .btn-success {
      background-color: #1cc88a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.3s, transform 0.2s;
    }
    .btn-primary:hover, .btn-success:hover {
      background-color: #17a673;
      transform: translateY(-2px);
    }
    .links a {
      color: #4e73df;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover {
      color: #1cc88a;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="reset-card">
  <h2>Reset Password</h2>
  <p>Enter your new password below.</p>

  <form th:action="@{/forgot-password/reset}" method="post">
    <div class="mb-3 text-start">
      <label for="newPassword" class="form-label">New Password</label>
      <input type="password" name="newPassword" class="form-control" placeholder="Enter new password" required>
    </div>
    <div class="mb-3 text-start">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm new password" required>
    </div>
    <button type="submit" class="btn btn-success mb-3">Reset Password</button>
  </form>

  <div class="links">
    <a href="/">Back to Login</a>
  </div>

  <input type="hidden" id="serverMessage" th:value="${msg}" />
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const serverMessage = document.getElementById("serverMessage")?.value;
  if (serverMessage && serverMessage.trim() !== "") {
    const lowerMsg = serverMessage.toLowerCase();
    const isError = lowerMsg.includes('invalid') || lowerMsg.includes('disabled') || lowerMsg.includes('pending') || lowerMsg.includes('not found') || lowerMsg.includes('match') || lowerMsg.includes('same');
    Swal.fire({
      title: 'Notification',
      text: serverMessage,
      icon: isError ? 'error' : 'success',
      confirmButtonColor: '#1cc88a',
      background: '#f9f9f9',
      color: '#333',
      timer: 4000,
      timerProgressBar: true
    });
  }
});
</script>

</body>
</html>
