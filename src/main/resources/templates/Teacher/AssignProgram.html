<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
    <title>EduInsight | Program Lifecycle Manager</title>
</head>
<body>
<main class="container-fluid px-4 py-5">

    <div class="row mb-5 animate__animated animate__fadeIn">
        <div class="col-lg-12">
            <div class="glass-search-card p-4 shadow-sm rounded-4 border-0">
                <div class="row align-items-center g-3">
                    <div class="col-xl-3 col-lg-12">
                        <h2 class="fw-bold text-dark m-0 d-flex align-items-center">
                            <span class="icon-circle bg-success text-white me-3"><i class="bi bi-calendar-range"></i></span>
                            Assigned Programs
                        </h2>
                    </div>
                    
                    <div class="col-xl-9 col-lg-12">
                        <div class="row g-2 justify-content-end">
                            <div class="col-md-3">
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-search text-success"></i></span>
                                    <input type="text" id="nameSearch" class="form-control border-0 bg-light" placeholder="Search curriculum...">
                                </div>
                            </div>
                            
                            <div class="col-md-2">
                                <select id="monthFilter" class="form-select border-0 bg-light" onchange="filterPrograms()">
                                    <option value="">All Months</option>
                                    <option th:each="m : ${#numbers.sequence(1,12)}" 
                                            th:value="${m < 10 ? '0'+m : m}" 
                                            th:text="${T(java.time.Month).of(m)}"></option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <select id="yearFilter" class="form-select border-0 bg-light" onchange="filterPrograms()">
                                    <option value="">All Years</option>
                                    <option value="2025">2025</option>
                                    <option value="2026">2026</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <div class="btn-group w-100 shadow-xs rounded-3 overflow-hidden">
                                    <button class="btn btn-success active btn-status py-2" onclick="filterStatus('all', this)">All</button>
                                    <button class="btn btn-outline-success btn-status py-2" onclick="filterStatus('ongoing', this)">Active</button>
                                    <button class="btn btn-outline-success btn-status py-2" onclick="filterStatus('upcoming', this)">Planned</button>
                                </div>
                            </div>
                            
                            <div class="col-md-1">
                                <button class="btn btn-light w-100 py-2 border" onclick="resetFilters()" title="Reset All">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="timeline-container">
        
        <div class="status-section mb-5" id="ongoingSection">
            <div class="d-flex align-items-center mb-4">
                <div class="pulse-indicator me-3"></div>
                <h4 class="section-title text-success m-0">LIVE TRAINING CYCLES</h4>
                <hr class="flex-grow-1 ms-4 opacity-10">
            </div>
            
            <div class="row g-4" id="ongoingGrid">
                <div th:each="assign : ${assignedPrograms}" 
                     th:if="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd') >= #strings.toString(assign.program.startDate) 
                             and #temporals.format(#temporals.createNow(), 'yyyy-MM-dd') <= #strings.toString(assign.program.endDate)}"
                     class="col-xl-3 col-md-6 program-card"
                     th:data-name="${assign.program.trainingProgram}" 
                     th:data-start="${assign.program.startDate}" 
                     th:data-end="${assign.program.endDate}">
                    
                    <div class="card border-0 shadow-sm h-100 premium-card ongoing-border">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between mb-3">
                                <span class="badge bg-soft-success text-success px-3 py-2 rounded-pill">ONGOING</span>
                                <i class="bi bi-broadcast text-danger"></i>
                            </div>
                            <h5 class="fw-bold mb-3 text-dark-navy" th:text="${assign.program.trainingProgram}">Name</h5>
                            <div class="small text-muted mb-4">
                                <i class="bi bi-calendar-check me-2"></i> Ends: [[${assign.program.endDate}]]
                            </div>
                            <a th:href="@{programDetail/{id}(id=${assign.program.id})}" class="btn btn-success w-100 rounded-pill fw-bold">
                                MANAGE CYCLE
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-section mb-5" id="upcomingSection">
            <div class="d-flex align-items-center mb-4 text-warning">
                <i class="bi bi-hourglass-split me-3 fs-4"></i>
                <h4 class="section-title m-0">UPCOMING SCHEDULES</h4>
                <hr class="flex-grow-1 ms-4 opacity-10">
            </div>
            
            <div class="row g-4" id="upcomingGrid">
                <div th:each="assign : ${assignedPrograms}" 
                     th:if="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd') < #strings.toString(assign.program.startDate)}"
                     class="col-xl-3 col-md-6 program-card"
                     th:data-name="${assign.program.trainingProgram}" 
                     th:data-start="${assign.program.startDate}" 
                     th:data-end="${assign.program.endDate}">
                    
                    <div class="card border-0 shadow-sm h-100 premium-card upcoming-border bg-white">
                        <div class="card-body p-4">
                            <span class="badge bg-soft-warning text-warning px-3 py-2 rounded-pill mb-3">PLANNED</span>
                            <h5 class="fw-bold mb-3" th:text="${assign.program.trainingProgram}">Name</h5>
                            <p class="small text-muted">Verification required by:<br><strong th:text="${assign.program.startDate}"></strong></p>
                            <a th:href="@{programDetail/{id}(id=${assign.program.id})}" class="btn btn-outline-warning w-100 rounded-pill fw-bold">
                                VIEW READINESS
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-section" id="completedSection">
            <div class="d-flex align-items-center mb-4 text-secondary">
                <i class="bi bi-archive-fill me-3 fs-4"></i>
                <h4 class="section-title m-0">HISTORICAL AUDITS</h4>
                <hr class="flex-grow-1 ms-4 opacity-10">
            </div>
            
            <div class="row g-4" id="completedGrid">
                <div th:each="assign : ${assignedPrograms}" 
                     th:if="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd') > #strings.toString(assign.program.endDate)}"
                     class="col-xl-3 col-md-6 program-card"
                     th:data-name="${assign.program.trainingProgram}" 
                     th:data-start="${assign.program.startDate}" 
                     th:data-end="${assign.program.endDate}">
                    
                    <div class="card border-0 shadow-sm h-100 premium-card completed-border opacity-75 grayscale-hover">
                        <div class="card-body p-4 text-center">
                            <div class="mb-3"><i class="bi bi-check-all text-success fs-3"></i></div>
                            <h5 class="fw-bold mb-2 text-muted" th:text="${assign.program.trainingProgram}">Name</h5>
                            <small class="text-muted d-block mb-3">Pedagogy Archive: [[${assign.program.endDate}]]</small>
                            <a th:href="@{programDetail/{id}(id=${assign.program.id})}" class="btn btn-light-soft text-dark w-100 rounded-pill btn-sm fw-bold border">
                                FINAL AUDIT
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function filterPrograms() {
            const nameQuery = document.getElementById('nameSearch').value.toLowerCase();
            const monthQuery = document.getElementById('monthFilter').value;
            const yearQuery = document.getElementById('yearFilter').value;
            
            const cards = document.querySelectorAll('.program-card');

            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const startDate = card.getAttribute('data-start');
                const endDate = card.getAttribute('data-end');

                const startYear = startDate.split('-')[0];
                const startMonth = startDate.split('-')[1];
                const endYear = endDate.split('-')[0];
                const endMonth = endDate.split('-')[1];

                const matchesName = name.includes(nameQuery);
                const matchesMonth = monthQuery === "" || (startMonth === monthQuery || endMonth === monthQuery);
                const matchesYear = yearQuery === "" || (startYear === yearQuery || endYear === yearQuery);

                card.style.display = (matchesName && matchesMonth && matchesYear) ? "block" : "none";
            });
            checkEmptySections();
        }

        document.getElementById('nameSearch').addEventListener('input', filterPrograms);

        function resetFilters() {
            document.getElementById('nameSearch').value = "";
            document.getElementById('monthFilter').value = "";
            document.getElementById('yearFilter').value = "";
            filterPrograms();
            filterStatus('all', document.querySelector('.btn-status'));
        }

        function filterStatus(status, btn) {
            document.querySelectorAll('.btn-status').forEach(b => {
                b.classList.remove('btn-success', 'active');
                b.classList.add('btn-outline-success');
            });
            btn.classList.replace('btn-outline-success', 'btn-success');
            btn.classList.add('active');

            const sections = {'ongoing': 'ongoingSection', 'upcoming': 'upcomingSection', 'completed': 'completedSection'};
            if (status === 'all') {
                Object.values(sections).forEach(id => document.getElementById(id).classList.remove('d-none'));
            } else {
                Object.entries(sections).forEach(([key, id]) => {
                    document.getElementById(id).classList.toggle('d-none', key !== status);
                });
            }
        }

        function checkEmptySections() {
            ['ongoingGrid', 'upcomingGrid', 'completedGrid'].forEach(gridId => {
                const grid = document.getElementById(gridId);
                const section = grid.closest('.status-section');
                const visibleCards = Array.from(grid.querySelectorAll('.program-card')).filter(c => c.style.display !== 'none');
                section.classList.toggle('d-none', visibleCards.length === 0);
            });
        }
    </script>

    <style>
        body { background-color: #f4f7fa; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-search-card { background: white; position: sticky; top: 10px; z-index: 1000; border: 1px solid #e2e8f0; }
        .premium-card { border-radius: 1.5rem !important; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent !important; }
        .premium-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08) !important; }
        
        .ongoing-border { border-left: 6px solid #10b981 !important; }
        .upcoming-border { border-left: 6px solid #f59e0b !important; }
        .completed-border { border-left: 6px solid #64748b !important; }
        
        .bg-soft-success { background: #eefdf5; }
        .bg-soft-warning { background: #fffbeb; }
        .text-dark-navy { color: #064e3b; }
        
        .icon-circle { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .pulse-indicator { width: 14px; height: 14px; background: #10b981; border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        
        .grayscale-hover:hover { filter: grayscale(0); opacity: 1 !important; }
        .section-title { font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; font-size: 0.9rem; }
        .btn-light-soft { background: #f1f5f9; border: 1px solid #e2e8f0; }
    </style>

</main>
</body>
</html>
