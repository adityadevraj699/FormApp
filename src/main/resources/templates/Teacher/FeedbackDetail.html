<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
  <title>Feedback Detail</title>
</head>
<body>
<main class="container my-5">
 <!-- Flex container for top-right alignment -->
  <div class="d-flex justify-content-end mb-3">
    <a th:href="@{/feedback/report/{id}(id=${feedback.id})}" class="btn btn-primary">
      Feedback Report
    </a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<div class="accordion" id="questionAccordion">
  <div class="accordion-item mb-3" th:each="entry, iter : ${answersByQuestion}">
    <h2 class="accordion-header" th:id="'heading-' + ${iter.index}">
      <button class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              th:data-bs-target="'#collapse-' + ${iter.index}"
              aria-expanded="false"
              th:aria-controls="'collapse-' + ${iter.index}">
        <i class="bi bi-question-circle me-2"></i>
        <span th:utext="${#strings.replace(entry.key.questionText, '\n', '<br/>')}"></span>

      </button>
    </h2>

    <div th:id="'collapse-' + ${iter.index}"
         class="accordion-collapse collapse"
         th:aria-labelledby="'heading-' + ${iter.index}"
         data-bs-parent="#questionAccordion">

      <div class="accordion-body">
        <ul class="list-group">
          <li class="list-group-item" th:each="ans : ${entry.value}">
            <span th:text="${ans.answer}">Answer</span>
          </li>
        </ul>

        <div class="alert alert-info mt-3" th:if="${entry.key.answerType.name() == 'NUMBER'}">
          <strong>Average:</strong>
          <span th:text="${#numbers.formatDecimal(avgByQuestion[entry.key.id], 1, 2)}"></span>
        </div>

        <div class="alert alert-success mt-3">
  <h6>AI Insights</h6>

  <p><strong>Summary:</strong>
     <span th:text="${analysisByQuestion[entry.key.id].summary}"></span>
  </p>

  <p><strong>Weak Areas:</strong></p>
  <ul>
    <li th:each="w : ${weakPointsByQuestion[entry.key.id]}"
        th:text="${w}"></li>
  </ul>

  <p><strong>Improvement Suggestions:</strong></p>
  <ul>
    <li th:each="s : ${suggestionsByQuestion[entry.key.id]}"
        th:text="${s}"></li>
  </ul>

  <p><strong>Sentiment:</strong>
    <span th:text="${analysisByQuestion[entry.key.id].sentimentLabel}"></span>
  </p>
</div>


      <div class="mt-3">
<button class="btn btn-primary btn-sm"
        th:attr="data-feedbackId=${feedback.id}, data-questionId=${entry.key.id}"
        th:id="'viz-btn-' + ${entry.key.id}"
        onclick="loadQuestionChart(this)"
        th:text="${entry.key.answerType.name() == 'NUMBER' ? 'Show Score Chart' : 'Show Response Chart'}">
</button>


  <!-- Compact popup card -->
  <div th:id="'chartWrap-' + ${entry.key.id}" class="mt-3 card shadow-sm p-3" 
       style="display:none; max-width: 400px;">
    <canvas th:id="'chart-' + ${entry.key.id}" width="400" height="250"></canvas>
    <div class="mt-2 text-end">
    
      <button class="btn btn-outline-secondary btn-sm"
              th:onclick="'closeChart(' + ${entry.key.id} + ')'" >
        Close
      </button>
    </div>
  </div>
</div>


      </div>
    </div>
  </div>
</div>

<script>
const charts = {};

async function loadQuestionChart(btn) {
    const feedbackId = btn.dataset.feedbackid;
    const questionId = btn.dataset.questionid;
    const wrap = document.getElementById('chartWrap-' + questionId);
    const canvas = document.getElementById('chart-' + questionId);

    if (wrap.style.display === 'block') {
        wrap.style.display = 'none';
        if (charts[questionId]) { charts[questionId].destroy(); delete charts[questionId]; }
        return;
    }

    btn.disabled = true; btn.innerText = 'Loading...';

    try {
        const res = await fetch(`/feedback/report/${feedbackId}/question/${questionId}/student-chart`);
        if (!res.ok) throw new Error('Server error');
        const json = await res.json();
        wrap.style.display = 'block';
        if (charts[questionId]) charts[questionId].destroy();

        const ctx = canvas.getContext('2d');
        const type = json.chartType === 'bar' ? 'bar' : 'pie';

        const config = {
            type: type,
            data: {
                labels: json.labels,
                datasets: [{
                    label: json.meta?.questionText || '',
                    data: json.data,
                    backgroundColor: json.backgroundColors || undefined
                }]
            },
            options: {}
        };

        if (type === 'bar') {
            config.options = {
                scales: { y: { beginAtZero: true, suggestedMin: json.meta?.rangeStart ?? 0, suggestedMax: json.meta?.rangeEnd ?? undefined } }
            };
        } else {
            config.options = { plugins: { legend: { position: 'bottom' } } };
        }

        charts[questionId] = new Chart(ctx, config);

    } catch (err) {
        console.error(err); alert('Failed to load chart: ' + err.message);
    } finally {
        btn.disabled = false; btn.innerText = 'Show Visualization';
    }
}

function closeChart(questionId) {
    const wrap = document.getElementById('chartWrap-' + questionId);
    if (wrap) wrap.style.display = 'none';
    if (charts[questionId]) { charts[questionId].destroy(); delete charts[questionId]; }
}
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</main>
</body>
</html>
