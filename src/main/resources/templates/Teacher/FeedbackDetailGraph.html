<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
  <title>Feedback Detail</title>
</head>
<body>
<main class="container my-5">

  <div class="d-flex justify-content-end mb-3">
  <!-- Existing single-question report -->
  <a th:href="@{/feedback/report/{id}(id=${feedback.id})}" class="btn btn-secondary me-2">
    Feedback Report
  </a>

  <!-- ✅ New full download button -->
 <a th:href="@{/Teacher/feedbackReport/full/{id}(id=${feedback.id})}" 
   class="btn btn-success ms-2">
  Download Full Report (with Charts)
</a>

</div>


  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <div class="accordion" id="questionAccordion">
    <div class="accordion-item mb-3" th:each="entry, iter : ${answersByQuestion}">
      <h2 class="accordion-header" th:id="'heading-' + ${iter.index}">
        <button class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                th:data-bs-target="'#collapse-' + ${iter.index}"
                aria-expanded="false"
                th:aria-controls="'collapse-' + ${iter.index}"
                onclick="toggleAccordion(this)">
          <i class="bi bi-question-circle me-2"></i>
          <span th:utext="${#strings.replace(entry.key.questionText, '\n', '<br/>')}">Question text</span>
        </button>
      </h2>

      <div th:id="'collapse-' + ${iter.index}"
           class="accordion-collapse collapse"
           th:aria-labelledby="'heading-' + ${iter.index}"
           data-bs-parent="#questionAccordion">

        <div class="accordion-body">
          <ul class="list-group">
            <li class="list-group-item" th:each="ans : ${entry.value}">
              <span th:text="${ans.answer}">Answer</span>
            </li>
          </ul>

          <!-- Only show average for number type questions -->
          <div class="alert alert-info mt-3" th:if="${entry.key.answerType.name() == 'NUMBER'}">
            <strong>Average:</strong>
            <span th:text="${#numbers.formatDecimal(avgByQuestion[entry.key.id], 1, 2)}"></span>
          </div>

          <!-- Chart visualization button -->
<div class="mt-3">
  <button class="btn btn-primary btn-sm"
          th:attr="data-feedbackId=${feedback.id}, data-questionId=${entry.key.id}, data-type=${entry.key.answerType.name()}"
          onclick="loadQuestionChart(this)">
    Show Visualization
  </button>

  <!-- ✅ Container for dual charts -->
  <div th:id="'chartWrap-' + ${entry.key.id}" class="mt-3 card shadow-sm p-3"
       style="display:none; max-width: 850px;">
    <div class="row">
      <!-- Left Chart -->
      <div class="col-md-6 text-center">
        <canvas th:id="'chart1-' + ${entry.key.id}" width="400" height="250"></canvas>
      </div>
      <!-- Right Chart -->
      <div class="col-md-6 text-center">
        <canvas th:id="'chart2-' + ${entry.key.id}" width="400" height="250"></canvas>
      </div>
    </div>
    <div class="mt-3 text-end">
      <button class="btn btn-outline-secondary btn-sm"
              th:onclick="'closeChart(' + ${entry.key.id} + ')'" >
        Close
      </button>
    </div>
  </div>
</div>


        </div>
      </div>
    </div>
  </div>

  <script>
const charts = {};

async function loadQuestionChart(btn) {
  const feedbackId = btn.dataset.feedbackid;
  const questionId = btn.dataset.questionid;
  const type = btn.dataset.type;
  const wrap = document.getElementById('chartWrap-' + questionId);
  const c1 = document.getElementById('chart1-' + questionId);
  const c2 = document.getElementById('chart2-' + questionId);

  if (wrap.style.display === 'block') {
    closeChart(questionId);
    return;
  }

  btn.disabled = true; btn.innerText = 'Loading...';

  try {
    const res = await fetch(`/feedback/report/${feedbackId}/question/${questionId}/student-chart`);
    if (!res.ok) throw new Error('Server error');
    const json = await res.json();
    wrap.style.display = 'block';

    // Clean up old charts
    if (charts[questionId]) {
      charts[questionId].forEach(ch => ch.destroy());
    }

    const colorPalette = [
      '#4e79a7', '#f28e2b', '#e15759', '#76b7b2',
      '#59a14f', '#edc948', '#b07aa1', '#ff9da7',
      '#9c755f', '#bab0ac'
    ];
    const bgColors = (json.backgroundColors && json.backgroundColors.some(c => c))
        ? json.backgroundColors
        : colorPalette.slice(0, json.data.length);

    // --- CHART 1 (Original: bar or pie)
    const ctx1 = c1.getContext('2d');
    const type1 = json.chartType === 'bar' ? 'bar' : 'pie';
    const config1 = {
      type: type1,
      data: {
        labels: json.labels,
        datasets: [{
          label: json.title || '',
          data: json.data,
          backgroundColor: bgColors,
          borderColor: '#ffffff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: type1 === 'pie' ? 'bottom' : 'top' },
          title: {
            display: true,
            text: json.title || 'Question Visualization'
          }
        },
        scales: type1 === 'bar' ? {
          x: { title: { display: true, text: 'Responses' } },
          y: { beginAtZero: true, title: { display: true, text: 'Value / Rating' } }
        } : {}
      }
    };

    // --- CHART 2 (New: line chart)
    const ctx2 = c2.getContext('2d');
    const config2 = {
      type: 'line',
      data: {
        labels: json.labels,
        datasets: [{
          label: type === 'NUMBER' ? 'Student Ratings Trend' : 'Sentiment Trend',
          data: json.data,
          fill: false,
          borderColor: '#4e79a7',
          tension: 0.3,
          pointBackgroundColor: '#f28e2b'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: true },
          title: {
            display: true,
            text: type === 'NUMBER' ? 'Range vs Student Responses' : 'Text Sentiment Trend'
          }
        },
        scales: {
          x: { title: { display: true, text: 'Students / Answers' } },
          y: { title: { display: true, text: type === 'NUMBER' ? 'Rating (1–5)' : 'Sentiment' } }
        }
      }
    };

    const ch1 = new Chart(ctx1, config1);
    const ch2 = new Chart(ctx2, config2);
    charts[questionId] = [ch1, ch2];

  } catch (err) {
    console.error(err);
    alert('Failed to load chart: ' + err.message);
  } finally {
    btn.disabled = false; btn.innerText = 'Show Visualization';
  }
}

function closeChart(questionId) {
  const wrap = document.getElementById('chartWrap-' + questionId);
  if (wrap) wrap.style.display = 'none';
  if (charts[questionId]) {
    charts[questionId].forEach(ch => ch.destroy());
    delete charts[questionId];
  }
}
</script>


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</main>
</body>
</html>
