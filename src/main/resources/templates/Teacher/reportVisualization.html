<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>EduInsight | Analytics Dashboard</title>
</head>
<body>
<main class="container-fluid px-4 my-4">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary: #4361ee; --danger: #e63946; --warning: #ffb703; 
            --success: #2a9d8f; --bg: #f8f9fc; --card-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.12);
        }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: #2d3748; }
        
        .page-header { background: #fff; padding: 25px; border-radius: 20px; margin-bottom: 30px; box-shadow: var(--card-shadow); border-bottom: 4px solid var(--primary); }
        
        .nav-tabs { border: none; gap: 10px; margin-bottom: 30px; }
        .nav-link { border: none !important; font-weight: 700; padding: 12px 25px; border-radius: 12px !important; color: #718096; transition: 0.3s; }
        .nav-link.active { background-color: var(--primary) !important; color: white !important; box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3); }

        /* Card Styling */
        .full-width-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: var(--card-shadow); margin-bottom: 30px; border: 1px solid rgba(0,0,0,0.02); width: 100%; }
        
        /* ✅ HEIGHT ADJUSTMENTS */
        .chart-container-matrix { position: relative; height: 600px; width: 100%; }
        .chart-container-trend { position: relative; height: 400px; width: 100%; }
        .chart-container-grid { position: relative; height: 260px; width: 100%; }
        
        .alert-item { border-radius: 15px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; border-left: 6px solid; font-weight: 600; }
        .alert-critical { background: #fff1f2; border-color: var(--danger); color: #9f1239; }
        .alert-risk { background: #fff7ed; border-color: var(--warning); color: #9a3412; }
        
        .question-text { color: #4a5568; font-weight: 700; font-size: 0.9rem; margin-bottom: 15px; display: block; min-height: 40px; }
        .section-title { font-weight: 800; color: #1a202c; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    </style>

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold m-0"><i class="bi bi-cpu-fill text-primary"></i> AI Pedagogical Dashboard</h2>
            <p class="text-muted m-0 small">SDG-4 Quality Assurance Analysis | Feedback ID: <span th:text="${feedbackId}"></span></p>
        </div>
        <a th:href="@{'/feedback/report/' + ${feedbackId} + '/download'}" class="btn btn-primary px-4 py-2 rounded-3 fw-bold border-0 shadow-sm" style="background: var(--primary);">
            <i class="bi bi-file-earmark-pdf-fill"></i> Download PDF
        </a>
    </div>

    <ul class="nav nav-tabs p-2 bg-white rounded-4 shadow-sm" id="dashboardTabs" role="tablist">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#summary"><i class="bi bi-shield-lock-fill"></i> Executive Summary</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#metrics"><i class="bi bi-bar-chart-steps"></i> Metric Breakdown</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#sentiment"><i class="bi bi-robot"></i> AI Sentiment</a></li>
    </ul>

    <div class="tab-content pt-2">
        
        <div class="tab-pane fade show active" id="summary">
            
            <div class="full-width-card border-top border-danger border-5">
                <h4 class="section-title text-danger"><i class="bi bi-lightning-charge-fill"></i> Urgent Improvement Areas</h4>
                <div id="riskContainer" class="row g-2">
                    </div>
            </div>

            <div class="full-width-card border-start border-primary border-5">
                <h4 class="section-title text-primary"><i class="bi bi-grid-3x3-gap-fill"></i> Rating Distribution Matrix</h4>
                <p class="text-muted small mb-4">Detailed density analysis of student responses across all parameters.</p>
                <div class="chart-container-matrix">
                    <canvas id="matrixChart"></canvas>
                </div>
            </div>

            <div class="full-width-card">
                <h4 class="section-title text-dark"><i class="bi bi-graph-up"></i> Performance Average Trend</h4>
                <div class="chart-container-trend">
                    <canvas id="trendLineChart"></canvas>
                </div>
            </div>

        </div>

        <div class="tab-pane fade" id="metrics">
            <div class="row g-4">
                <div th:each="chart, iterStat : ${individualCharts}" th:if="${chart.chartType == 'bar'}" class="col-xl-4 col-md-6">
                    <div class="full-width-card p-4 shadow-sm">
                        <span class="question-text" th:text="${chart.title}"></span>
                        <div class="chart-container-grid">
                            <canvas th:id="'individualChart-' + ${iterStat.index}"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="sentiment">
            <div class="row g-4">
                <div th:each="chart, iterStat : ${individualCharts}" th:if="${chart.chartType == 'pie'}" class="col-xl-4 col-md-6 text-center">
                    <div class="full-width-card p-4 shadow-sm">
                        <span class="question-text" th:text="${chart.title}"></span>
                        <div class="chart-container-grid">
                            <canvas th:id="'individualChart-' + ${iterStat.index}"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.onload = function() {
            const indData = /*[[${individualCharts}]]*/ [];
            const trend = /*[[${trendChart}]]*/ {};
            const range = /*[[${rangeChart}]]*/ {};

            // 🧠 Risk Detection
            function runRiskDetection() {
                let riskHtml = "";
                if(trend && trend.values) {
                    trend.values.forEach((val, idx) => {
                        const cleanLabel = trend.labels[idx].split('\n')[0].substring(0, 70) + "...";
                        if (val < 3.0) {
                            riskHtml += `<div class="col-md-6"><div class="alert-item alert-critical"><i class="bi bi-exclamation-octagon-fill fs-4 me-3"></i><div><b>CRITICAL:</b> ${cleanLabel} (Score: ${val}/5)</div></div></div>`;
                        } else if (val < 3.5) {
                            riskHtml += `<div class="col-md-6"><div class="alert-item alert-risk"><i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i><div><b>RISK:</b> ${cleanLabel} (Score: ${val}/5)</div></div></div>`;
                        }
                    });
                }
                document.getElementById('riskContainer').innerHTML = riskHtml || `<div class="p-4 text-success fw-bold"><i class="bi bi-check-circle-fill me-2"></i>All parameters are performing optimally.</div>`;
            }
            runRiskDetection();

            Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

            // Matrix Chart
            if (range.labels) {
                new Chart(document.getElementById('matrixChart'), {
                    type: 'bar',
                    data: {
                        labels: range.questions.map(q => q.length > 50 ? q.substring(0,50) + "..." : q),
                        datasets: range.labels.map((l, i) => ({
                            label: 'Rating ' + l, data: range.values.map(v => v[i]),
                            backgroundColor: [`#e63946`, `#f4a261`, `#ffb703`, `#4361ee`, `#2a9d8f`][i]
                        }))
                    },
                    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true, ticks: {stepSize:1} }, y: { stacked: true } } }
                });
            }

            // Trend Chart
            if (trend.labels) {
                new Chart(document.getElementById('trendLineChart'), {
                    type: 'line',
                    data: {
                        labels: trend.labels.map(l => l.substring(0,25) + "..."),
                        datasets: [{ label: 'Avg Rating', data: trend.values, borderColor: '#4361ee', tension: 0.4, fill: true, backgroundColor: 'rgba(67, 97, 238, 0.05)', pointRadius: 5 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 5 } } }
                });
            }

            // Grid Charts
            indData.forEach((data, index) => {
                const canvas = document.getElementById('individualChart-' + index);
                if (!canvas) return;
                const isPie = data.chartType === 'pie';
                new Chart(canvas, {
                    type: data.chartType, 
                    data: {
                        labels: data.labels,
                        datasets: [{ data: data.values, backgroundColor: isPie ? ['#2a9d8f', '#ffb703', '#e63946'] : 'rgba(67, 97, 238, 0.8)', borderRadius: isPie?0:8 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: isPie, position: 'bottom' } }, scales: isPie ? {} : { y: { beginAtZero: true, ticks: {stepSize:1} } } }
                });
            });
        };
        /*]]>*/
    </script>
</main>
</body>
</html>
