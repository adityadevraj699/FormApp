<html xmlns:th="http://www.thymeleaf.org" th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
    <title>Program Feedbacks</title>
</head>
<body>
<main class="container my-5">

    <h2 class="text-center text-primary fw-bold mb-5">
        🎓 My Program Feedbacks
    </h2>

    <div class="accordion" id="programAccordion">

        <!-- Program Loop -->
        <div class="accordion-item mb-3" th:each="assign, iter : ${assignedPrograms}">
            
           <h2 class="accordion-header" th:id="'heading-' + ${iter.index}">
    <button class="accordion-button collapsed" 
            type="button" 
            data-bs-toggle="collapse" 
            th:data-bs-target="'#collapse-' + ${iter.index}" 
            aria-expanded="false" 
            th:aria-controls="'collapse-' + ${iter.index}">
        <i class="bi bi-journal-bookmark me-2"></i>
        <span th:text="${assign.program.trainingProgram}">Program Name</span>
    </button>
</h2>

<!-- Accordion Body -->
<div th:id="'collapse-' + ${iter.index}" 
     class="accordion-collapse collapse" 
     th:aria-labelledby="'heading-' + ${iter.index}" 
     data-bs-parent="#programAccordion">

                 
                <div class="accordion-body">
                    <div class="row g-4">
                        <div class="col-md-4" th:each="fb : ${programFeedbacks[assign.program.id]}">
                            <div class="card feedback-card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">
                                        <i class="bi bi-chat-left-text text-primary"></i>
                                        <span th:text="${fb.feedbackPhase.phaseName}">Feedback Phase</span>
                                    </h5>
                                    <p class="card-text text-muted mb-2">
                                        <i class="bi bi-calendar-event text-secondary"></i>
                                        <strong>Start:</strong> <span th:text="${fb.startDate}"></span>
                                    </p>
                                    <p class="card-text text-muted">
                                        <i class="bi bi-calendar-check text-success"></i>
                                        <strong>End:</strong> <span th:text="${fb.endDate}"></span>
                                    </p>
                                    <a th:href="@{'/Teacher/FeedbackDetail/' + ${fb.id}}" 
                                       class="btn btn-details btn-sm mt-2">
                                        View Details →
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- No Feedbacks -->
                    <div class="alert alert-info mt-4 mb-0" 
                         th:if="${#lists.isEmpty(programFeedbacks[assign.program.id])}">
                        <i class="bi bi-info-circle"></i> No feedbacks available for this program.
                    </div>
                </div>
            </div>
        </div>

    </div>
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #f8f9fc;
        }
        .accordion-button {
            background: linear-gradient(135deg, #0056b3, #007bff);
            color: white;
            font-weight: 600;
            border-radius: 12px !important;
            box-shadow: none;
        }
        .accordion-button:not(.collapsed) {
            background: linear-gradient(135deg, #004494, #0056b3);
            color: #fff;
        }
        .accordion-button::after {
            filter: invert(1);
        }
        .feedback-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            border: 1px solid #eaeaea;
        }
        .feedback-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
        .btn-details {
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border: none;
            transition: background 0.3s ease;
        }
        .btn-details:hover {
            background: linear-gradient(135deg, #0056b3, #0099cc);
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</main>
</body>
</html>
