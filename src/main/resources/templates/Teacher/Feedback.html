<html xmlns:th="http://www.thymeleaf.org" th:replace="~{Teacher/Teacherbase::layout(~{::main})}">
<head>
  <title>Program Feedbacks</title>
</head>
<body>
<main class="container my-5">

  <h2 class="text-center text-primary fw-bold mb-5">
    🎓 My Program Feedbacks
  </h2>

  <div class="accordion" id="programAccordion">

    <!-- Program Loop -->
    <div class="accordion-item mb-3" th:each="assign, iter : ${assignedPrograms}">
      <h2 class="accordion-header" th:id="'heading-' + ${iter.index}">
        <button class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                th:data-bs-target="'#collapse-' + ${iter.index}"
                aria-expanded="false"
                th:aria-controls="'collapse-' + ${iter.index}">
          <i class="bi bi-journal-bookmark me-2"></i>
          <span th:text="${assign.program.trainingProgram}">Program Name</span>
        </button>
      </h2>

      <!-- Accordion Body -->
      <div th:id="'collapse-' + ${iter.index}"
           class="accordion-collapse collapse"
           th:aria-labelledby="'heading-' + ${iter.index}"
           data-bs-parent="#programAccordion">

        <div class="accordion-body">

          <!-- Feedbacks Table -->
          <div th:if="${!#lists.isEmpty(programFeedbacks[assign.program.id])}">
            <div class="table-responsive">
              <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary text-center">
                  <tr>
                    <th>#</th>
                    <th>Feedback Phase</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="fb, index : ${programFeedbacks[assign.program.id]}">
                    <td th:text="${index.index + 1}">1</td>
                    <td>
                      <i class="bi bi-chat-left-text text-primary"></i>
                      <span th:text="${fb.feedbackPhase.phaseName}">Feedback Phase</span>
                    </td>
                    <td>
                      <i class="bi bi-calendar-event text-secondary"></i>
                      <span th:text="${fb.startDate}"></span>
                    </td>
                    <td>
                      <i class="bi bi-calendar-check text-success"></i>
                      <span th:text="${fb.endDate}"></span>
                    </td>
                    <td class="text-center">
                      <a th:href="@{'/Teacher/FeedbackDetail/' + ${fb.id}}"
                         class="btn btn-outline-primary btn-sm">
                        Details
                      </a>
                      <a th:href="@{'/Teacher/FeedbackDetailGraph/' + ${fb.id}}"
                         class="btn btn-outline-info btn-sm">
                        Graph
                      </a>
                      <a th:href="@{'/Teacher/feedbackReport/allStudents/' + ${fb.id}}"
                         class="btn btn-outline-success btn-sm">
                        <i class="bi bi-download"></i> PDF
                      </a>
                      <a th:href="@{/feedback/report/{id}(id=${fb.id})}"
                         class="btn btn-primary btn-sm">
                        Visualization
                      </a>
                      <a th:href="@{/feedback/report/{id}/download(id=${fb.id})}"
                         class="btn btn-success btn-sm">
                        ⬇️ Report
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- No Feedbacks -->
          <div class="alert alert-info mt-4 mb-0"
               th:if="${#lists.isEmpty(programFeedbacks[assign.program.id])}">
            <i class="bi bi-info-circle"></i>
            No feedbacks available for this program.
          </div>

        </div>
      </div>
    </div>

  </div>

  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      background: #f8f9fc;
    }
    .accordion-button {
      background: linear-gradient(135deg, #0056b3, #007bff);
      color: white;
      font-weight: 600;
      border-radius: 12px !important;
      box-shadow: none;
    }
    .accordion-button:not(.collapsed) {
      background: linear-gradient(135deg, #004494, #0056b3);
      color: #fff;
    }
    .accordion-button::after {
      filter: invert(1);
    }
    .table {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }
    .table th {
      font-weight: 600;
      text-transform: uppercase;
    }
    .btn {
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.8rem;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</main>
</body>
</html>
