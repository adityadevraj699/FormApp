<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>Teacher Zone - OAS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* Full height layout */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: rgba(135,206,250,0.05);
      margin: 0;
    }

    .main-wrapper {
      display: flex;
      flex-grow: 1;
      height: calc(100vh - 56px); /* navbar height */
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: linear-gradient(to bottom, rgb(0,81,195), rgb(15,106,3));
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,0.2);
    }

    .sidebar a {
      padding: 12px 18px;
      font-size: 15px;
      display: block;
      color: #fff;
      text-decoration: none;
    }

    .sidebar a:hover {
      background-color: rgba(255,255,255,0.1);
    }

    /* Scrollable content */
.content-area {
  flex-grow: 1;
  padding: 20px;
  overflow-y: auto; /* scroll enable */
  background-color: #f8f9fa;
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE 10+ */
}

/* Chrome, Edge, Safari */
.content-area::-webkit-scrollbar {
  display: none;
}

  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg" style="background:linear-gradient(to right, rgb(0,81,195), rgb(15,106,3));">
    <a class="navbar-brand ms-3 fw-bold text-white" href="/Teacher/Dashboard">JavaX Pro</a>
    <div class="ms-auto me-3">
      <div class="dropdown">
        <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle fw-bold"
           href="#" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">

          <img th:src="${session.loggedInTeacher.profileImage != null} ? ${session.loggedInTeacher.profileImage} : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
               alt="profile" width="32" height="32" class="rounded-circle me-2" />
          <span th:text="${session.loggedInTeacher.name}">Teacher</span>
        </a>  

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" href="/Teacher/ViewProfile"><i class="bi bi-person"></i> View Profile</a></li>
          <li><a class="dropdown-item" href="/Teacher/ChangePassword"><i class="bi bi-gear"></i> Change Password</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Layout -->
  <div class="main-wrapper">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <h6 class="m-0 text-uppercase" 
          style="padding:15px;font-size:14px;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.2);">
        Teacher Menu
      </h6>

      <a href="/Teacher/Dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/Teacher/AssignProgram"><i class="bi bi-diagram-3"></i> Assign Program</a>
      <a href="/Teacher/Feedback"><i class="bi bi-chat-square-text"></i> Feedback</a>
    </div>

    <!-- Scrollable Content Area -->
    <div class="content-area">
      <div th:replace="${content}"></div>
    </div>

  </div>

  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
