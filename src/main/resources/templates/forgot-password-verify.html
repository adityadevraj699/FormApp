<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .otp-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 30px 25px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .otp-card h2 {
      color: #000;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .otp-card p {
      color: #000;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .otp-inputs {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
    }
    .otp-inputs input {
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .otp-inputs input:focus {
      border-color: #1cc88a;
      box-shadow: 0 0 5px rgba(28,200,138,0.5);
      outline: none;
    }
    .btn-primary {
      background-color: #1cc88a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.3s, transform 0.2s;
    }
    .btn-primary:hover {
      background-color: #17a673;
      transform: translateY(-2px);
    }
    .links a {
      color: #4e73df;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover {
      color: #1cc88a;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="otp-card">
    <h2>Verify OTP</h2>
    <p>Please enter the 6-digit OTP sent to your email.</p>

    <form th:action="@{/forgot-password/verify}" method="post" id="otpForm">
      <div class="otp-inputs">
        <input type="text" name="otp1" maxlength="1" required>
        <input type="text" name="otp2" maxlength="1" required>
        <input type="text" name="otp3" maxlength="1" required>
        <input type="text" name="otp4" maxlength="1" required>
        <input type="text" name="otp5" maxlength="1" required>
        <input type="text" name="otp6" maxlength="1" required>
      </div>

      <button type="submit" class="btn btn-primary mb-3">Verify OTP</button>
    </form>

    <div class="links">
      <a href="/">Back to Login</a>
    </div>

    <input type="hidden" id="serverMessage" th:value="${msg}" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
  // SweetAlert2 notification
  document.addEventListener("DOMContentLoaded", function () {
    const serverMessage = document.getElementById("serverMessage")?.value;
    if (serverMessage && serverMessage.trim() !== "") {
      const lowerMsg = serverMessage.toLowerCase();
      const isError = lowerMsg.includes('invalid') || lowerMsg.includes('disabled') || lowerMsg.includes('pending') || lowerMsg.includes('not found');
      Swal.fire({
        title: 'Notification',
        text: serverMessage,
        icon: isError ? 'error' : 'success',
        confirmButtonColor: '#1cc88a',
        background: '#f9f9f9',
        color: '#333',
        timer: 4000,
        timerProgressBar: true
      });
    }
  });

  const inputs = document.querySelectorAll('.otp-inputs input');

  inputs.forEach((input, index) => {
    // On input
    input.addEventListener('input', () => {
      if (input.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    // On backspace
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && input.value === '' && index > 0) {
        inputs[index - 1].focus();
      }
    });

    // On paste
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text');
      const digits = pasteData.replace(/\D/g, '').slice(0, 6); // Only numbers, max 6 digits

      digits.split('').forEach((d, i) => {
        if (inputs[i]) {
          inputs[i].value = d;
        }
      });

      // Focus next empty input or last
      const firstEmpty = Array.from(inputs).find(i => i.value === '');
      if (firstEmpty) firstEmpty.focus();
      else inputs[inputs.length - 1].focus();
    });
  });

  // Combine OTP before submitting
  const form = document.getElementById('otpForm');
  form.addEventListener('submit', (e) => {
    const otpValue = Array.from(inputs).map(i => i.value).join('');
    const hiddenOtp = document.createElement('input');
    hiddenOtp.type = 'hidden';
    hiddenOtp.name = 'otp';
    hiddenOtp.value = otpValue;
    form.appendChild(hiddenOtp);

    // Disable individual inputs to avoid duplicate submission
    inputs.forEach(i => i.disabled = true);
  });
</script>


</body>
</html>
