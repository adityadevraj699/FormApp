<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .forgot-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 30px 25px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .forgot-card h2 {
      color: #000;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .forgot-card p {
      color: #000;
      font-size: 0.95rem;
    }
    .forgot-card .btn-primary {
      background-color: #1cc88a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.3s, transform 0.2s;
    }
    .forgot-card .btn-primary:hover {
      background-color: #17a673;
      transform: translateY(-2px);
    }
    .links a {
      color: #4e73df;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover {
      color: #1cc88a;
      text-decoration: underline;
    }
    .form-label {
      font-weight: 600;
      color: #000;
    }
    input.form-control {
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="forgot-card">
    <h2>Forgot Password</h2>
    <p class="mb-4">Enter your role and registered email to reset your password.</p>

    <form th:action="@{/forgot-password/request}" method="post">
      <div class="mb-3 text-start">
        <label for="role" class="form-label">Select Role</label>
        <select name="role" class="form-select" required>
          <option value="STUDENT">Student</option>
          <option value="TEACHER">Teacher</option>
        </select>
      </div>

      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="example@mitmeerut.ac.in" required>
      </div>

      <button type="submit" class="btn btn-primary mb-3">Send OTP</button>
    </form>

    <div class="links">
      <a href="http://localhost:8800/">Back to Login</a>
    </div>

    <input type="hidden" id="serverMessage" th:value="${msg}" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || lowerMsg.includes('disabled') || lowerMsg.includes('pending') || lowerMsg.includes('not found');
        Swal.fire({
          title: 'Notification',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#1cc88a',
          background: '#f9f9f9',
          color: '#333',
          timer: 4000,
          timerProgressBar: true
        });
      }
    });
  </script>

</body>
</html>
