<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Student/Studentbase::layout(~{::main})}">
<main class="container my-4">

  <!-- Page Title -->
  <h1 class="mb-4 fw-bold text-primary border-bottom pb-2">
    All Programs
  </h1>

  <!-- ✅ Responsive Grid for Programs -->
  <div class="row g-4">
    
    <!-- Loop over each program -->
    <div class="col-md-4 col-sm-6" th:each="assign : ${programList}">
      <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">

        <!-- Optional gradient header -->
        <div class="card-header text-white fw-bold"
             style="background:linear-gradient(to right, rgb(0,81,195), rgb(15,106,3));">
          <span th:text="${assign.program.trainingProgram}">Program Name</span>
        </div>

        <div class="card-body">
          <p class="card-text mb-1">
            <strong>Teacher:</strong>
            <span th:text="${assign.teacher.name}">Teacher Name</span>
            
          </p>
          <p class="card-text mb-1">
            <strong>Start Date:</strong>
            <span th:text="${#temporals.format(assign.program.startDate, 'yyyy-MM-dd')}">2025-09-25</span>
          </p>
          <p class="card-text mb-3">
            <strong>End Date:</strong>
            <span th:text="${#temporals.format(assign.program.endDate, 'yyyy-MM-dd')}">2025-10-25</span>
          </p>
        </div>

        <div class="card-footer bg-transparent border-0">
          <a th:href="@{/Student/programDetail/{id}(id=${assign.program.id})}"
             class="btn btn-primary w-100">
            Details
          </a>
        </div>

      </div>
    </div>

    <!-- If no programs -->
    <div th:if="${#lists.isEmpty(programList)}" class="text-center text-muted py-5">
      <i class="bi bi-exclamation-circle fs-2 d-block mb-2"></i>
      No programs available right now.
    </div>

  </div>
</main>
</html>
