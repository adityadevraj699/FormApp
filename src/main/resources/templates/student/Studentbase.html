<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>Student Zone - OAS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- ✅ Tailwind for utility responsiveness -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      background-color: rgba(135,206,250,0.05);
      overflow-x: hidden;
    }

    /* Wrapper */
    .main-wrapper {
      display: flex;
      flex-grow: 1;
      height: calc(100vh - 56px);
      transition: all 0.3s ease;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: linear-gradient(to bottom, rgb(0,81,195), rgb(15,106,3));
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      z-index: 1050;
    }

    .sidebar a {
      padding: 12px 18px;
      font-size: 15px;
      display: block;
      color: #fff;
      text-decoration: none;
    }

    .sidebar a:hover {
      background-color: rgba(255,255,255,0.1);
    }

    /* Hidden (only on mobile/tablet) */
    @media (max-width: 991px) {
      .sidebar {
        position: fixed;
        top: 56px;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.active {
        transform: translateX(0);
      }
    }

    /* Content Area */
    .content-area {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #f8f9fa;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .content-area::-webkit-scrollbar {
      display: none;
    }

    /* On small screens, reduce padding */
    @media (max-width: 991px) {
      .content-area {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg px-3" style="background:linear-gradient(to right, rgb(0,81,195), rgb(15,106,3));">
    <div class="d-flex align-items-center w-100 justify-content-between">
      
      <!-- ☰ Sidebar Toggle (mobile only) -->
      <button class="btn btn-link text-white d-lg-none me-2" id="sidebarToggle">
        <i class="bi bi-list fs-3"></i>
      </button>

      <!-- Logo -->
      <a class="navbar-brand fw-bold text-white" href="/Student/Dashboard">EduInsight</a>

      <!-- Profile -->
      <div class="dropdown">
        <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle fw-bold"
           href="#" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">

          <!-- Profile Image or Initial -->
<div class="d-flex align-items-center">
    <!-- Image available -->
    <img th:if="${session.loggedInStudent.profileImage != null}"
         th:src="@{${session.loggedInStudent.profileImage}}"
         alt="profile"
         class="rounded-circle me-2"
         style="width:36px; height:36px; object-fit:cover;"/>

    <!-- No image: show first letter -->
    <div th:if="${session.loggedInStudent.profileImage == null}"
         class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2"
         style="width:36px; height:36px; font-weight:bold; font-size:16px;">
        <span th:text="${session.loggedInStudent.name != null ? session.loggedInStudent.name.substring(0,1) : 'S'}">S</span>
    </div>
</div>


          <!-- Name only visible on tablet/desktop -->
          <span class="d-none d-md-inline" th:text="${session.loggedInStudent.name}">Student</span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" href="/Student/viewProfile"><i class="bi bi-person"></i> View Profile</a></li>
          <li><a class="dropdown-item" href="/Student/changePassword"><i class="bi bi-gear"></i> Change Password</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🔹 Layout -->
  <div class="main-wrapper">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <h6 class="m-0 text-uppercase" 
          style="padding:15px;font-size:14px;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.2);">
        Student Menu
      </h6>

      <a href="/Student/Dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/Student/TotalProgram"><i class="bi bi-diagram-3"></i> Total Program</a>
      <a href="/Student/EnrolledProgram"><i class="bi bi-check2-circle"></i> Enrolled Program</a>
      <a href="/Student/Feedback"><i class="bi bi-chat-square-text"></i> Feedback</a>
      <a href="/Student/HistoryFeedback"><i class="bi bi-clock-history"></i> History Feedback</a>
    </div>

    <!-- Content -->
    <div class="content-area" id="contentArea">
      <div th:replace="${content}"></div>
    </div>

  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Sidebar Toggle Script -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const contentArea = document.getElementById('contentArea');

    // Show/hide sidebar on mobile
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });

    // Hide sidebar if clicking content (on mobile)
    contentArea.addEventListener('click', () => {
      if (window.innerWidth < 992 && sidebar.classList.contains('active')) {
        sidebar.classList.remove('active');
      }
    });
  </script>
</body>
</html>
