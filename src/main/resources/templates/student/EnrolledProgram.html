<html th:replace="~{Student/Studentbase::layout(~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="container my-4">

    <h2 class="mb-4">My Enrolled Programs</h2>

    <!-- ✅ Active Programs Section -->
    <h4 class="mb-3 text-success">Active Programs</h4>
    <div th:if="${#lists.isEmpty(enrolledProgramsApproved)}">
        <p class="text-center text-muted">No active programs yet.</p>
    </div>
    <div class="row g-4" th:if="${!#lists.isEmpty(enrolledProgramsApproved)}">
        <div class="col-md-4" th:each="assign : ${enrolledProgramsApproved}">
            <div class="card h-100 shadow-sm border-success">
                <div class="card-body">
                    <h5 class="card-title" th:text="${assign.program.trainingProgram}">Program Name</h5>
                    <p class="card-text mb-1"><strong>Start Date:</strong> 
                        <span th:text="${assign.program.startDate}">2025-09-25</span>
                    </p>
                    <p class="card-text mb-3"><strong>End Date:</strong> 
                        <span th:text="${assign.program.endDate}">2025-10-25</span>
                    </p>

                    <!-- Program Details Button -->
                    <a th:href="@{/Student/programDetail/{id}(id=${assign.program.id})}" 
                       class="btn btn-success w-100">
                        View Program
                    </a>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <!-- ✅ Pending Programs Section -->
    <h4 class="mb-3 text-warning">Enrolled Programs (Pending Approval)</h4>
    <div th:if="${#lists.isEmpty(enrolledProgramsPending)}">
        <p class="text-center text-muted">No pending programs.</p>
    </div>
    <div class="row g-4" th:if="${!#lists.isEmpty(enrolledProgramsPending)}">
        <div class="col-md-4" th:each="assign : ${enrolledProgramsPending}">
            <div class="card h-100 shadow-sm border-warning">
                <div class="card-body">
                    <h5 class="card-title" th:text="${assign.program.trainingProgram}">Program Name</h5>
                    <p class="card-text mb-1"><strong>Start Date:</strong> 
                        <span th:text="${assign.program.startDate}">2025-09-25</span>
                    </p>
                    <p class="card-text mb-3"><strong>End Date:</strong> 
                        <span th:text="${assign.program.endDate}">2025-10-25</span>
                    </p>

                    <!-- Pending Badge instead of button -->
                    <span class="badge bg-warning text-dark w-100 py-2">Pending Approval</span>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
