<!DOCTYPE html>
<html th:replace="~{Student/Studentbase::layout(~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="container-fluid px-4 py-5">

    <div class="row mb-5">
        <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden" style="background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);">
                <div class="card-body p-4 p-md-5">
                    <div class="row align-items-center">
                        <div class="col-md-auto text-center mb-4 mb-md-0">
                            <div class="position-relative d-inline-block">
                                <img th:if="${student.profileImage != null}"
                                     th:src="@{${student.profileImage}}"
                                     class="rounded-circle border border-4 border-white border-opacity-25 shadow-lg object-cover"
                                     alt="Profile"
                                     style="width: 150px; height: 150px;">
                                     
                                <div th:if="${student.profileImage == null}"
                                     class="rounded-circle border border-4 border-white border-opacity-25 d-flex align-items-center justify-content-center shadow-lg mx-auto bg-white text-success"
                                     style="width: 150px; height: 150px; font-size: 64px; font-weight: 800;">
                                    <span th:text="${student.name != null ? student.name.substring(0,1) : 'S'}">S</span>
                                </div>
                                <span class="position-absolute bottom-0 end-0 bg-success border border-4 border-dark-navy rounded-circle p-2 shadow-sm" title="Active Account"></span>
                            </div>
                        </div>

                        <div class="col text-center text-md-start text-white">
                            <div class="badge bg-white text-success rounded-pill px-3 py-2 mb-2 fw-bold ls-1" th:text="${student.role != null ? student.role : 'STUDENT'}">VERIFIED STUDENT</div>
                            <h1 class="display-5 fw-bold mb-1" th:text="${student.name}">Student Name</h1>
                            <p class="opacity-75 mb-3 fs-5">
                                <i class="bi bi-hash me-1"></i> Roll No: <span th:text="${student.rollNo}">123</span> | 
                                <i class="bi bi-calendar3 me-1"></i> Joined <span th:text="${#temporals.format(student.regDate, 'MMM yyyy')}">Jan 2024</span>
                            </p>
                            <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2">
                                <a th:href="@{/Student/EditProfile}" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm">
                                    <i class="bi bi-pencil-square me-2"></i>Edit Profile
                                </a>
                                <a th:href="@{/logout}" class="btn btn-outline-light rounded-pill px-4 border-2 opacity-75 hover-opacity-100">
                                    <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex align-items-center">
                    <div class="icon-box bg-soft-success text-success rounded-3 me-3 p-2">
                        <i class="bi bi-mortarboard-fill fs-4"></i>
                    </div>
                    <h5 class="mb-0 fw-bold text-dark">Academic Credentials</h5>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-sm-6">
                            <div class="p-3 border rounded-3 bg-light-subtle">
                                <small class="text-muted text-uppercase fw-bold ls-1 d-block mb-1">Course & Degree</small>
                                <span class="fs-5 fw-semibold" th:text="${student.course ?: 'N/A'}">B.Tech</span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 border rounded-3 bg-light-subtle">
                                <small class="text-muted text-uppercase fw-bold ls-1 d-block mb-1">Specialization/Branch</small>
                                <span class="fs-5 fw-semibold" th:text="${student.branch ?: 'N/A'}">CSE</span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="text-center p-3 border rounded-3">
                                <small class="text-muted d-block mb-1">Current Year</small>
                                <span class="badge bg-success-light text-success px-3 py-2 rounded-pill fw-bold" th:text="${student.year ?: 'N/A'}">Third</span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="text-center p-3 border rounded-3">
                                <small class="text-muted d-block mb-1">Semester</small>
                                <span class="fs-4 fw-bold text-primary" th:text="${student.semester ?: '0'}">5</span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="text-center p-3 border rounded-3">
                                <small class="text-muted d-block mb-1">Section</small>
                                <span class="fs-4 fw-bold text-warning" th:text="${student.section ?: 'N/A'}">A</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex align-items-center">
                    <div class="icon-box bg-soft-primary text-primary rounded-3 me-3 p-2">
                        <i class="bi bi-person-lines-fill fs-4"></i>
                    </div>
                    <h5 class="mb-0 fw-bold text-dark">Contact Details</h5>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label class="small text-muted d-block mb-1"><i class="bi bi-envelope-at me-2"></i>Official Email</label>
                        <span class="fw-bold" th:text="${student.email}">student@college.edu</span>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted d-block mb-1"><i class="bi bi-telephone me-2"></i>Contact Number</label>
                        <span class="fw-bold" th:text="${student.contactNo ?: 'Not Provided'}">+91 0000000000</span>
                    </div>
                    <div class="mb-0">
                        <label class="small text-muted d-block mb-1"><i class="bi bi-geo-alt me-2"></i>Residential Address</label>
                        <span class="fw-medium text-secondary" th:text="${student.address ?: 'Update your address'}">City, State</span>
                    </div>
                </div>
                <div class="card-footer bg-light border-0 p-4">
                    <h6 class="fw-bold small text-muted text-uppercase mb-3">Family Information</h6>
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted">Father:</small>
                        <small class="fw-bold text-dark" th:text="${student.fatherName ?: 'N/A'}"></small>
                    </div>
                    <div class="d-flex justify-content-between">
                        <small class="text-muted">Mother:</small>
                        <small class="fw-bold text-dark" th:text="${student.motherName ?: 'N/A'}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        body { background-color: #f4f7fa; font-family: 'Plus Jakarta Sans', sans-serif; }
        .rounded-4 { border-radius: 1rem !important; }
        .ls-1 { letter-spacing: 1px; }
        .bg-soft-success { background-color: #eefdf5; }
        .bg-soft-primary { background-color: #eef2ff; }
        .bg-success-light { background-color: #dcfce7; }
        .text-dark-navy { color: #064e3b; }
        .object-cover { object-fit: cover; }
        .hover-opacity-100:hover { opacity: 1 !important; }
        
        .card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 1rem 3rem rgba(0,0,0,.175)!important; }
        
        @media (max-width: 768px) {
            .display-5 { font-size: 2rem; }
        }
    </style>

    <input type="hidden" id="serverMessage" th:value="${success != null ? success : (error != null ? error : '')}" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
      const serverMessage = document.getElementById("serverMessage")?.value;
      if (serverMessage && serverMessage.trim() !== "") {
        const lowerMsg = serverMessage.toLowerCase();
        const isError = lowerMsg.includes('invalid') || lowerMsg.includes('failed') || lowerMsg.includes('error');
        Swal.fire({
          title: isError ? 'Error' : 'Profile Updated',
          text: serverMessage,
          icon: isError ? 'error' : 'success',
          confirmButtonColor: '#065f46',
          timer: 3500,
          timerProgressBar: true
        });
      }
    });
    </script>

</main>
</body>
</html>
