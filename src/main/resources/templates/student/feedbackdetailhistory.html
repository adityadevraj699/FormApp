<html th:replace="~{Student/Studentbase::layout(~{::main})}">
<body>
<main class="container mt-4">
    <!-- Back Button -->
    <div class="mt-3 text-start">
        <a href="/Student/HistoryFeedback" class="btn btn-secondary">
            ← Back to History
        </a>
    </div>

    <h2 class="mb-4 text-center text-primary">
        Feedback Detail - [[${feedback.program.trainingProgram}]]
    </h2>

   

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Question</th>
                <th>Your Answer</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ans, iStat : ${answers}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${ans.question.questionText}"></td>
                <td th:text="${ans.answer}"></td>
            </tr>
            <tr th:if="${answers == null or answers.isEmpty()}">
                <td colspan="3" class="text-center text-muted">
                    No answers found for this feedback.
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
