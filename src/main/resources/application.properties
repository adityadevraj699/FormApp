spring.application.name=FormApp

# ===============================
# Database Configuration (MySQL)  oas_db
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/<dbname>?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=<db_password>

# ===============================
# JPA/Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Port
# ===============================
server.port=8800


#================================
#Email Service 
#================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=adevraj934@gmail.com
spring.mail.password=<email app password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


# Cloudinary Config
cloudinary.cloud_name=<your_cloud_name>
cloudinary.api_key=<your_api_key>
cloudinary.api_secret=<your_api_secret>

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


ai.api.url=https://openrouter.ai/api/v1/chat/completions
ai.api.key=<your_api_key>



spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10




